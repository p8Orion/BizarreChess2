<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bizarre Chess</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="game-hud" hidden>
      <div class="hud-units">
        <div class="hud-unit" id="hud-selected-slot">
          <div class="hud-portrait-wrap" data-empty="true">
            <canvas id="hud-portrait" width="176" height="176"></canvas>
          </div>
          <div class="hud-identity">
            <div id="hud-name">Select a piece</div>
            <div id="hud-move">Tap a piece to see how it moves.</div>
            <div class="hud-unit-actions" id="hud-selected-actions"></div>
          </div>
        </div>
        <div class="hud-unit is-hover" id="hud-hover-slot" hidden>
          <div class="hud-portrait-wrap" id="hud-hover-portrait-wrap" data-empty="true">
            <canvas id="hud-hover-portrait" width="176" height="176"></canvas>
          </div>
          <div class="hud-identity">
            <div id="hud-hover-name"></div>
            <div id="hud-hover-move"></div>
            <div class="hud-unit-actions" id="hud-hover-actions"></div>
          </div>
        </div>
      </div>
      <div class="hud-main">
        <div class="hud-meta">
          <div id="hud-turn">Turn 1</div>
          <div id="net-info"></div>
          <button id="btn-resign" class="ghost">Resign</button>
        </div>
        <div id="hud-actions"></div>
        <div id="hud-notice" hidden></div>
      </div>
    </header>

    <div id="menu-card">
      <div class="menu-head">
        <div id="title">Bizarre Chess</div>
        <button id="btn-settings" class="ghost" type="button">Settings</button>
      </div>
      <div id="settings-panel" hidden>
        <label class="setting">
          <input id="setting-auto-pickup" type="checkbox" />
          <span>
            <strong>Agarrar los objetos automáticamente</strong>
            <em>Al aterrizar sobre un objeto, se recoge en el mismo turno.</em>
          </span>
        </label>
      </div>
      <div id="menu-status">Choose army, board, colors and pattern, then play offline or host a room.</div>
      <div id="menu">
        <section class="menu-panel" id="army-panel">
          <div class="sep">Army</div>
          <div id="army-rosters">
            <label class="army">
              P1 army
              <select id="army-kind"></select>
            </label>
            <label class="army">
              P2 army
              <select id="army-p2"></select>
            </label>
            <div class="army-actions">
              <button id="btn-copy-army" class="ghost" type="button">Copy army</button>
              <button id="btn-army-editor" class="ghost" type="button">Edit army</button>
            </div>
          </div>
          <div class="colors">
            <div class="player-style">
              <span>P1</span>
              <label title="Primary"><input id="color-p1" type="color" value="#f2ebd9" /></label>
              <label title="Secondary"><input id="color-p1-sec" type="color" value="#c4a15a" /></label>
              <select id="pattern-p1" aria-label="P1 pattern"></select>
            </div>
            <div class="player-style">
              <span>P2</span>
              <label title="Primary"><input id="color-p2" type="color" value="#33261f" /></label>
              <label title="Secondary"><input id="color-p2-sec" type="color" value="#8a5a2b" /></label>
              <select id="pattern-p2" aria-label="P2 pattern"></select>
            </div>
          </div>
        </section>
        <section class="menu-panel" id="mode-panel">
          <div class="sep">Modo de juego</div>
          <div class="choice-row" id="match-mode" role="radiogroup" aria-label="Match mode">
            <button type="button" class="choice is-on" data-mode="normal">Normal</button>
            <button type="button" class="choice" data-mode="draft">Draft</button>
          </div>
          <div class="choice-row" id="army-format" role="radiogroup" aria-label="Army format">
            <button type="button" class="choice" data-format="normal">Normal</button>
            <button type="button" class="choice is-on" data-format="mini">Mini</button>
          </div>
          <div id="draft-options" hidden>
            <label class="draft-bans-label">
              Bans
              <input id="draft-ban-count" type="number" min="0" max="4" value="1" />
            </label>
            <label class="draft-uniq-label">
              Repeats
              <select id="draft-uniq">
                <option value="unique">Unique</option>
                <option value="unique-per-player">Unique per player</option>
                <option value="free" selected>No restrictions</option>
              </select>
            </label>
            <div class="choice-row" id="draft-pick-mode" role="radiogroup" aria-label="Draft pick order"></div>
          </div>
          <label class="board">
            Mapa
            <select id="board-kind"></select>
          </label>
          <label class="scatter">
            Cantidad de items
            <input id="item-amount" type="range" min="0" max="40" step="5" />
            <span id="item-amount-val">5%</span>
          </label>
          <label class="scatter">
            Cantidad de obstáculos
            <input id="obstacle-amount" type="range" min="0" max="40" step="5" />
            <span id="obstacle-amount-val">5%</span>
          </label>
          <label class="setting scatter-flag">
            <input id="obstacle-symmetric" type="checkbox" checked />
            <span>Simétrico</span>
          </label>
        </section>
        <section class="menu-panel" id="play-panel">
          <button id="btn-offline">Play Offline</button>
          <div class="sep">Online</div>
          <button id="btn-host">Host</button>
          <div class="row">
            <input id="join-code" placeholder="Code" maxlength="6" />
            <button id="btn-join">Join</button>
          </div>
        </section>
      </div>
    </div>

    <div id="draft-card" hidden>
      <div class="menu-head">
        <div id="draft-title">Draft</div>
        <button id="btn-draft-leave" class="ghost" type="button">Leave</button>
      </div>
      <div id="draft-room"></div>
      <div id="draft-root"></div>
    </div>

    <aside id="army-editor-window" hidden>
      <div class="editor-window-bar">
        <strong id="army-editor-title">Army</strong>
        <button id="btn-close-army-editor" class="ghost" type="button">Close</button>
      </div>
      <section id="army-editor"></section>
    </aside>

    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
